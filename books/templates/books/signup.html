{% extends 'home.html' %}

{% block content %}
<link rel="stylesheet" href="{% static 'books/sign.css' %}">
<div class="auth-container">
  <h2>Реєстрація</h2>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn">Зареєструватися</button>
  </form>
  <p class="auth-link">Вже маєте акаунт?
    <a href="{% url 'login' %}">Увійти</a>
  </p>
</div>
{% endblock %}
